<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:if condition="{file.properties.mime_type} == 'video/infomaniakvod'">
    <f:then>
        <f:media class="video-embed-item" file="{file}" width="560" height="315" alt="{file.alternative}" title="{file.title}" additionalConfig="{settings.media.additionalConfig}" />
    </f:then>
    <f:else>
        <f:media class="video-embed-item" file="{file}" width="{dimensions.width}" height="{dimensions.height}" alt="{file.alternative}" title="{file.title}" additionalConfig="{settings.media.additionalConfig}" />
    </f:else>
</f:if>

</html>
